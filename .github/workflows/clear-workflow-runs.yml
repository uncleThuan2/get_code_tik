name: Clear old workflow runs

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/clear_workflow_runs.sh
