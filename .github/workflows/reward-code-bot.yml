name: TikTok Reward Code Bot - Phase 1 POC

on:
  schedule:
    # Schedule times in UTC (Vietnam Time - 7 hours)
    # 18:35 Vietnam = 11:35 UTC
    # 19:35 Vietnam = 12:35 UTC
    # 20:35 Vietnam = 13:35 UTC
    # 21:35 Vietnam = 14:35 UTC
    - cron: "35 11 * * *"
    - cron: "35 12 * * *"
    - cron: "35 13 * * *"
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-reward-code-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System OCR Dependencies (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Phase 1 POC Bot
        env:
          HEADLESS: "true"
        run: |
          python -m app.main

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-screenshot
          path: screenshots/
          retention-days: 7
