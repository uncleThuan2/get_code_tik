name: TikTok Live Reward Code Bot

on:
  schedule:
    # Schedule times in UTC (Vietnam Time ICT is UTC+7)
    # 18:35 Vietnam = 11:35 UTC
    # 19:35 Vietnam = 12:35 UTC
    # 20:35 Vietnam = 13:35 UTC
    # 21:35 Vietnam = 14:35 UTC
    - cron: "35 11 * * *"
    - cron: "35 12 * * *"
    - cron: "35 13 * * *"
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-reward-code-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright Chromium Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install System OCR Dependencies (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & system deps
        run: |
          python -m playwright install chromium --with-deps

      - name: Run TikTok Reward Code Bot
        env:
          HEADLESS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m app.main

      - name: Commit and Push Updated Daily Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new reward code data to commit."
          else
            git commit -m "chore: update daily reward codes [skip ci]"
            git push
          fi

      - name: Upload Screenshot Artifacts (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-screenshot
          path: |
            screenshots/
            debug/
          retention-days: 1
